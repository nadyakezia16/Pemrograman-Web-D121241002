<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Media Kuliah Responsif</title>
    <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>
    <main class="page">
        <article class="card card--status-baru">
            <picture class="card__cover">
                <source
                srcset="cover-large.webp"
                media="(min-width: 768px)"
                type="image/webp">

                <source
                srcset="cover-small.webp"
                media="(max-width: 767px)"
                type="image/webp">
                <img
                src="cover-fallback.jpg"
                alt="Ilustrasi sampul materi cara membuat repository di Github"
                class="card__cover-img"
                loading="lazy">
            </picture>

        </article>
    </main>

</body>
</html>
